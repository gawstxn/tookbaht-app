name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Unit tests for lib/ and database tests (every migration on in-memory Postgres).
      - run: npm test

      # `next build` also type-checks the project.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
